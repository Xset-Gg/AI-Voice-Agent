name: voice-agent

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://voice:voice@postgres:5432/voice
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    UPLOAD_DIR: /data/uploads

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["${QDRANT_HOST_PORT:-6333}:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  api:
    build: ./backend
    <<: *backend-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    ports: ["${API_HOST_PORT:-8000}:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  worker:
    build: ./backend
    <<: *backend-env
    command: arq app.worker.WorkerSettings
    volumes: [uploads:/data/uploads]
    depends_on:
      api: { condition: service_healthy }

  agent:
    build: ./agent
    env_file: .env
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["${FRONTEND_HOST_PORT:-3000}:3000"]
    depends_on: [api]

  # --- Optional: self-hosted LiveKit (use `--profile livekit`). Most deployments use LiveKit Cloud. ---
  livekit:
    profiles: [livekit]
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes: [./deploy/livekit.yaml:/etc/livekit.yaml:ro]

  livekit-sip:
    profiles: [livekit]
    image: livekit/sip:latest
    network_mode: host
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://localhost:7880
        redis:
          address: localhost:6379
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: info

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  uploads:
